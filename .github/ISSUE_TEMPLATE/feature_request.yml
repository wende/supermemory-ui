name: Feature request
description: Propose an operator-console improvement.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Operator problem
      description: What task or decision is difficult today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Explain the desired workflow and which domain layer it affects.
    validations:
      required: true
  - type: checkboxes
    id: semantics
    attributes:
      label: Memory model
      options:
        - label: I considered documents, memories, spaces, profiles, versioning, soft forget, relations, and asynchronous ingestion where relevant.
          required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered

name: Bug report
description: Report reproducible behavior that is not working as intended.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve the console. Do not include secrets or private corpus content.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the actual and expected behavior.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide the smallest set of steps that reproduces the issue.
    validations:
      required: true
  - type: dropdown
    id: backend
    attributes:
      label: Backend mode
      options:
        - Bundled mock
        - Remote Supermemory instance
        - Both
        - Unknown
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Browser, operating system, Node.js version, and commit or deployment URL.
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Remove API keys, private URLs, and personal corpus content before posting.
